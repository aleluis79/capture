schema: spec-driven

context: |
  Proyecto: aplicación de escritorio "Captura", un grabador de pantalla simple.
  Plataformas objetivo: Linux (X11 y Wayland/GNOME) y Windows 10/11.
  Stack: Electron 45 + electron-vite + React 19 + TypeScript, con FFmpeg embebido.
  Idioma de la interfaz y de los artefactos: español.
  Metodología: SDD con OpenSpec y TDD (Vitest para dominio y UI, Playwright para humo).
  Sin audio en la versión inicial; el cursor lo incluye el compositor del sistema.

